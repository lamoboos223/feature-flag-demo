services:
  flipt:
    build:
      context: .
      dockerfile: Dockerfile.flipt
    container_name: flipt-server
    command: ["/flipt", "--config", "/etc/flipt/config.yml"]
    volumes:
      - ./flipt-config.yml:/etc/flipt/config.yml:ro
      - ./flipt-state-repo:/flipt-state-repo:ro
    ports:
      - "8080:8080"
      - "9000:9000"

  demo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flipt-flask-demo
    depends_on:
      - flipt
    environment:
      FLIPT_URL: http://flipt:8080
      FLIPT_NAMESPACE_KEY: default
      FLIPT_FLAG_NAME: api-version-v2
      PORT: "5000"
    ports:
      - "5000:5000"
    command: ["python", "app.py"]

  twk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twk-demo
    depends_on:
      - flipt
    environment:
      FLIPT_URL: http://flipt:8080
      FLIPT_NAMESPACE_KEY: default
      FLIPT_STATE_REPO: /flipt-state-repo
      PORT: "5001"
    volumes:
      - ./flipt-state-repo:/flipt-state-repo
    ports:
      - "5001:5001"
    command: ["python", "twk.py"]
