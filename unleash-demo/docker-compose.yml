services:
  db:
    image: postgres:16-alpine
    container_name: unleash-db
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: unleash_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash_user -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: unleash-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unleash_user:unleash_pass@db:5432/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: info
      INIT_CLIENT_API_TOKENS: default:development.unleash-insecure-api-token
      INIT_FRONTEND_API_TOKENS: default:development.unleash-insecure-frontend-api-token
    ports:
      - "4242:4242"

  demo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unleash-flask-demo
    depends_on:
      - unleash
    environment:
      UNLEASH_URL: http://unleash:4242/api
      UNLEASH_APP_NAME: flask-demo
      UNLEASH_INSTANCE_ID: flask-demo-instance
      UNLEASH_API_TOKEN: ${UNLEASH_API_TOKEN}
      UNLEASH_FLAG_NAME: api-version-v2
      UNLEASH_REFRESH_INTERVAL: "5"
      UNLEASH_METRICS_INTERVAL: "30"
      PORT: "5000"
    ports:
      - "5000:5000"
